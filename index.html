<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Global Time Zones</h1>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search time zones...">
            <select id="timezoneSelect">
                <option value="">-- Select to Add Time Zone --</option>
            </select>
            <button id="addBtn">Add Time Zone</button>
        </div>

        <div class="clocks-container" id="clocksContainer">
            <!-- Clocks will be dynamically added here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
